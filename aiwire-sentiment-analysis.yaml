version: "1"
kind: miner
id: 7410
slug: aiwire-sentiment-analysis
protocol: generic
name: AIWire Sentiment Analysis
description: >
  Sentiment analysis for a piece of text, answered by a language model at request time. Send
  the text or the whole question and the miner returns the overall sentiment (positive,
  negative, neutral or mixed) with one short reason drawn from the words that carry it. The
  answer is produced with MiniMax under a commercial plan held by the operator, so this miner
  is not keyless. Serves the SENTIMENT_ANALYSIS intent.
base_url: https://telegraph-ai.margyn.workers.dev

docs:
  documentation: https://telegraph-ai.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: text is the text to analyse or the whole question. A single passage, not a batch.
    param: text
    property: length
    value_num: 8000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim, for example 'What is the sentiment of
        this review: "..."'. The miner reads the text from it, so passing the whole question
        works as well as passing the text on its own.
    text:
      type: string
      description: The text whose sentiment should be judged.

output_schema:
  type: object
  properties:
    sentiment:
      type: string
      description: The overall sentiment in one word, positive, negative, neutral or mixed.
    summary:
      type: string
      description: The sentiment followed by one short sentence naming the words that carry it.
    confidence:
      type: number
      description: 0.96 for a direct model answer, lower when the answer is degraded.
    as_of:
      type: string
      description: Timestamp the answer was produced.

endpoints:
  - path: /sentiment
    external_path: /sentiment
    method: GET
    description: >
      Sentiment for one passage, the text as a query parameter (?text=...). Also accepts a
      whole question in ?question= or ?query=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - SENTIMENT_ANALYSIS

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: sentiment
        description: The overall sentiment in one word.
        source_path: sentiment
      - index: 1
        name: summary
        description: The sentiment plus one short reason.
        source_path: summary
    integers:
      - index: 0
        name: confidence_x100
        description: Confidence in the answer, scaled by one hundred to keep two digits as an integer.
        source_path: confidence
        multiplier: 100
  request:
    - endpoint: sentiment
      method: GET
      query_params:
        text: { source: strings.1 }
