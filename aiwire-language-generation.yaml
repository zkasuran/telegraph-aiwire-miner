version: "1"
kind: miner
id: 7413
slug: aiwire-language-generation
protocol: generic
name: AIWire Language Generation
description: >
  Language generation for a request, answered by a language model at request time. Send the
  request or the whole question and the miner returns a direct, concise answer that covers the
  key facts the request asks for, with no preamble. The answer is produced with MiniMax under a
  commercial plan held by the operator, so this miner is not keyless. Serves the
  LANGUAGE_GENERATION intent.
base_url: https://telegraph-ai.margyn.workers.dev

docs:
  documentation: https://telegraph-ai.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: prompt is the request or the whole question. A single request, not a batch.
    param: prompt
    property: length
    value_num: 8000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language request, verbatim, for example 'Explain what causes the
        seasons on Earth'. The miner treats it as the request to answer, so passing the whole
        question works as well as passing the request on its own.
    prompt:
      type: string
      description: The request the miner should answer.

output_schema:
  type: object
  properties:
    summary:
      type: string
      description: The direct answer to the request.
    confidence:
      type: number
      description: 0.96 for a direct model answer, lower when the answer is degraded.
    as_of:
      type: string
      description: Timestamp the answer was produced.

endpoints:
  - path: /language-generation
    external_path: /language-generation
    method: GET
    description: >
      A generated answer for one request, the request as a query parameter (?prompt=...). Also
      accepts a whole question in ?question= or ?query=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - LANGUAGE_GENERATION

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: summary
        description: The direct answer to the request.
        source_path: summary
    integers:
      - index: 0
        name: confidence_x100
        description: Confidence in the answer, scaled by one hundred to keep two digits as an integer.
        source_path: confidence
        multiplier: 100
  request:
    - endpoint: language-generation
      method: GET
      query_params:
        prompt: { source: strings.0 }
