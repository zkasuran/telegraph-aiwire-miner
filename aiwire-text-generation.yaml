version: "1"
kind: miner
id: 7412
slug: aiwire-text-generation
protocol: generic
name: AIWire Text Generation
description: >
  Free-form text generation, answered by a language model at request time. Send the writing
  task or the whole question and the miner returns exactly the text the task asks for, matching
  the requested format, tone and length, with no preamble. The answer is produced with MiniMax
  under a commercial plan held by the operator, so this miner is not keyless. Serves the
  TEXT_GENERATION intent.
base_url: https://telegraph-ai.margyn.workers.dev

docs:
  documentation: https://telegraph-ai.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: prompt is the writing task or the whole question. A single task, not a batch.
    param: prompt
    property: length
    value_num: 8000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language request, verbatim, for example 'Write a short professional
        email reminding a client an invoice is overdue'. The miner treats it as the writing
        task.
    prompt:
      type: string
      description: The writing task the miner should carry out.

output_schema:
  type: object
  properties:
    summary:
      type: string
      description: The generated text the task asked for.
    confidence:
      type: number
      description: 0.95 for a direct model answer, lower when the answer is degraded.
    as_of:
      type: string
      description: Timestamp the answer was produced.

endpoints:
  - path: /generate
    external_path: /generate
    method: GET
    description: >
      Generated text for one task, the task as a query parameter (?prompt=...). Also accepts a
      whole question in ?question= or ?query=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - TEXT_GENERATION

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: summary
        description: The generated text the task asked for.
        source_path: summary
    integers:
      - index: 0
        name: confidence_x100
        description: Confidence in the answer, scaled by one hundred to keep two digits as an integer.
        source_path: confidence
        multiplier: 100
  request:
    - endpoint: generate
      method: GET
      query_params:
        prompt: { source: strings.0 }
